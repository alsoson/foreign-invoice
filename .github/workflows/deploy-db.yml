name: Deploy Supabase

# main 分支的 supabase/ 有變更時：
#   1. 把新的 migration 推到 Supabase 雲端資料庫
#   2. 部署 Edge Functions（scan-receipt、delete-account）
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 到 repo 的 Settings → Secrets and variables → Actions → Secrets 設定
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: yzzbilxzpjyhxgiilzaw
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 連結 Supabase 專案
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: 顯示 migration 狀態
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: 套用尚未執行的 migration
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: 部署 Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
